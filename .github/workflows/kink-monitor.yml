name: KINK Metallica Lettermonitor

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'monitor.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/kink-monitor.yml'
      - 'notify.py'
      - 'forecast.py'
      - 'persist_state.py'
      - 'audio_clips.py'
  workflow_dispatch:
  schedule:
    # Twee verschoven tijdreeksen (elk 10 min, samen iedere 5 min).
    # GitHub kan deze geplande controles nog steeds vertragen of overslaan.
    - cron: '3-59/10 * 19-31 10 *'
    - cron: '8-59/10 * 19-31 10 *'

permissions:
  contents: write
  issues: write

concurrency:
  group: kink-lettermonitor-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.persist.outputs.changed }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore speech recognition model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kink-whisper-base-v1
      - name: Install requirements
        run: python -m pip install -q -r requirements.txt
      - name: Install and verify audio capture tools
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -hide_banner -version | head -n 1
      - name: Verify live radio feed and select working stream
        shell: bash
        timeout-minutes: 2
        run: |
          set -u
          echo "KINK_STREAM_OK=false" >> "$GITHUB_ENV"
          for candidate in             "https://playerservices.streamtheworld.com/api/livestream-redirect/KINKAAC.aac"             "https://playerservices.streamtheworld.com/api/livestream-redirect/KINK.mp3"             "https://29043.live.streamtheworld.com/KINKAAC.aac"; do
            rm -f /tmp/kink-probe.wav
            if timeout 22s ffmpeg -nostdin -hide_banner -loglevel error -y               -rw_timeout 9000000 -i "$candidate" -t 4               -vn -ac 1 -ar 8000 -c:a pcm_s16le /tmp/kink-probe.wav               >/dev/null 2>&1 && [ -s /tmp/kink-probe.wav ]               && [ "$(stat -c %s /tmp/kink-probe.wav)" -gt 15000 ]; then
              echo "STREAM_URL=$candidate" >> "$GITHUB_ENV"
              echo "KINK_STREAM_OK=true" >> "$GITHUB_ENV"
              echo "KINK stream heeft audio: $candidate"
              break
            fi
          done
          if ! grep -q "^STREAM_URL=" "$GITHUB_ENV"; then
            echo "::warning::Geen van de beschikbare KINK-streams gaf geluid; geen audio-opname mogelijk."
          fi
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Verify offline Dutch speech model on code changes
        if: ${{ github.event_name == 'push' }}
        timeout-minutes: 8
        run: |
          python -m pip install -q 'faster-whisper>=1.1,<2'
          python - <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel("base", device="cpu", compute_type="int8")
          print("Offline Dutch recognition engine loaded successfully")
          PY
      - name: Check KINK and record nearby Metallica
        run: python monitor.py
      - name: Save short listen-back MP3 as temporary GitHub artifact
        id: audio_upload
        uses: actions/upload-artifact@v4
        with:
          name: kink-audio-${{ github.run_id }}
          path: artifact_audio/*.mp3
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
      - name: Attach audio download link to observed Metallica event
        if: ${{ steps.audio_upload.outputs.artifact-id != '' }}
        run: python audio_clips.py
        env:
          AUDIO_ARTIFACT_ID: ${{ steps.audio_upload.outputs.artifact-id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: Send GitHub notifications for new Metallica plays and letters
        run: python notify.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFY_USER: GingeroDiablo
      - name: Save observed letters and transcripts safely
        id: persist
        run: python persist_state.py

  # Publiceer uitsluitend het dashboard uit docs/ op de Pages-root.
  publish:
    needs: watch
    if: ${{ needs.watch.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
