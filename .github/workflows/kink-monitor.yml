name: KINK Metallica Lettermonitor

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'monitor.py'
      - 'requirements.txt'
      - '.github/workflows/kink-monitor.yml'
  workflow_dispatch:
  schedule:
    # GitHub starttijden zijn best-effort en kunnen worden overgeslagen.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * 19-31 10 *'

permissions:
  contents: write

concurrency:
  group: kink-lettermonitor-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      changed: ${{ steps.persist.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -q -r requirements.txt
      - name: Check KINK and record nearby Metallica
        run: python monitor.py
        env:
          STREAM_URL: https://playerservices.streamtheworld.com/api/livestream-redirect/KINKAAC.aac
      - name: Save observed letters and transcripts
        id: persist
        shell: bash
        run: |
          if git diff --quiet -- docs/data/state.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/state.json
          git commit -m 'Update KINK 1500 results [skip ci]'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  publish:
    needs: watch
    if: ${{ needs.watch.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
